<div class="chat-panel">
  <div class="chat-messages" #messageList>
    <ng-container *ngIf="messages$ | async as messages">
      <div *ngFor="let msg of messages; trackBy:trackBy" class="chat-row"
        [ngClass]="{'my-message': msg.senderId === selfId, 'remote-message': msg.senderId !== selfId}">
        <div class="chat-bubble">
          <div class="chat-meta">
            <span class="chat-sender" [style.color]="msg.senderId !== selfId ? players[msg.senderId]?.playerColor : null">{{ msg.senderId !== selfId ? players[msg.senderId]?.playerName || msg.senderId.slice(0,6) : ''}}</span>
            <span class="chat-time">{{ msg.timestamp | date:'shortTime' }}</span>
          </div>
          <div class="chat-text">{{ msg.text }}</div>
        </div>
      </div>
      <p *ngIf="messages.length === 0" class="chat-empty">
        Nenhuma mensagem ainda. Diga oi!
      </p>
    </ng-container>
  </div>

  <form class="chat-input-row" (ngSubmit)="send()" autocomplete="off">
    <!-- [(ngModel)], not a template ref: a native input with no event binding never
         triggers change detection, so a ref-driven [disabled] stays stale and blocks
         the form's implicit Enter submit. -->
    <input
      class="chat-input"
      type="text"
      name="draft"
      [(ngModel)]="draft"
      placeholder="Digite uma mensagem..."
      maxlength="200"
      aria-label="Mensagem" />
    <ion-button type="submit" fill="solid" color="primary" size="small"
      [disabled]="!canSend" aria-label="Enviar mensagem">
      <ion-icon slot="icon-only" name="send"></ion-icon>
    </ion-button>
  </form>
</div>
