name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - firebase
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      # Pinned because Angular 21 requires node ^20.19.0 || ^22.12.0 || >=24.0.0 and this
      # workflow previously used whatever the runner image happened to ship.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ELIFOOT_98 }}'
          channelId: live
          projectId: elifoot-98
